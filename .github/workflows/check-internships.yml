name: Check Simplify Internships

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-internships
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship + new-grad checker
        env:
          # Summer internships
          SOFTWARE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.SOFTWARE_INTERNSHIPS_WEBHOOK_URL }}
          PRODUCT_MANAGEMENT_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.PRODUCT_MANAGEMENT_INTERNSHIPS_WEBHOOK_URL }}
          DATA_SCIENCE_ML_AI_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.DATA_SCIENCE_ML_AI_INTERNSHIPS_WEBHOOK_URL }}
          QUANTITATIVE_FINANCE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.QUANTITATIVE_FINANCE_INTERNSHIPS_WEBHOOK_URL }}
          HARDWARE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.HARDWARE_INTERNSHIPS_WEBHOOK_URL }}
          UNCATEGORIZED_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.UNCATEGORIZED_INTERNSHIPS_WEBHOOK_URL }}
          # Off-season internships (Fall/Winter/Spring)
          OFFSEASON_SOFTWARE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_SOFTWARE_INTERNSHIPS_WEBHOOK_URL }}
          OFFSEASON_PRODUCT_MANAGEMENT_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_PRODUCT_MANAGEMENT_INTERNSHIPS_WEBHOOK_URL }}
          OFFSEASON_DATA_SCIENCE_ML_AI_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_DATA_SCIENCE_ML_AI_INTERNSHIPS_WEBHOOK_URL }}
          OFFSEASON_QUANTITATIVE_FINANCE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_QUANTITATIVE_FINANCE_INTERNSHIPS_WEBHOOK_URL }}
          OFFSEASON_HARDWARE_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_HARDWARE_INTERNSHIPS_WEBHOOK_URL }}
          OFFSEASON_UNCATEGORIZED_INTERNSHIPS_WEBHOOK_URL: ${{ secrets.OFFSEASON_UNCATEGORIZED_INTERNSHIPS_WEBHOOK_URL }}
          # Full-time / new-grad roles
          FULLTIME_SOFTWARE_WEBHOOK_URL: ${{ secrets.FULLTIME_SOFTWARE_WEBHOOK_URL }}
          FULLTIME_PRODUCT_MANAGEMENT_WEBHOOK_URL: ${{ secrets.FULLTIME_PRODUCT_MANAGEMENT_WEBHOOK_URL }}
          FULLTIME_DATA_SCIENCE_ML_AI_WEBHOOK_URL: ${{ secrets.FULLTIME_DATA_SCIENCE_ML_AI_WEBHOOK_URL }}
          FULLTIME_QUANTITATIVE_FINANCE_WEBHOOK_URL: ${{ secrets.FULLTIME_QUANTITATIVE_FINANCE_WEBHOOK_URL }}
          FULLTIME_HARDWARE_WEBHOOK_URL: ${{ secrets.FULLTIME_HARDWARE_WEBHOOK_URL }}
          FULLTIME_UNCATEGORIZED_WEBHOOK_URL: ${{ secrets.FULLTIME_UNCATEGORIZED_WEBHOOK_URL }}
        run: python -m src

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_ids/
          git diff --staged --quiet || git commit -m "chore: update seen listing ids [skip ci]"
          git push